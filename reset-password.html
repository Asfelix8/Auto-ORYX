<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>AUTO ORYX — Récupérer mon accès</title><link rel="stylesheet" href="style.css?v=3-cloud"><style>body{min-width:0;background:#e9eff5}main.recovery{display:grid;min-height:100vh;place-items:center;padding:24px;margin:0}#newPassword[hidden],#requestReset[hidden]{display:none!important}.auth-card a{color:#176ad1;font-size:14px}.auth-card h1{font-size:24px}.auth-card input{box-sizing:border-box}#recoveryMessage{font-size:14px;line-height:1.6;white-space:pre-wrap;color:#815324}.auth-card button{width:100%}</style></head><body><main class="recovery"><section class="auth-card"><img src="assets/logo.png" alt=""><h1>AUTO <span>ORYX</span></h1><h2 id="recoveryTitle">Mot de passe oublié</h2><p id="recoveryMessage" role="status">Vérification du lien…</p><form id="requestReset" hidden><label>Adresse e-mail du compte<input name="email" type="email" autocomplete="username" required></label><p>Nous vous enverrons un lien pour choisir un nouveau mot de passe. Votre compte et ses droits seront conservés.</p><button type="submit" class="primary">Recevoir le lien de récupération</button></form><form id="newPassword" hidden><label>Nouveau mot de passe<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p>Choisissez au moins 12 caractères, avec lettres, chiffres et symboles.</p><label>Confirmer le nouveau mot de passe<input name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p><button type="submit" class="primary">Enregistrer mon nouveau mot de passe</button></p></form><a href="./">Retour à la connexion</a></section></main><script src="supabase-vendor.js?v=2.118.0"></script><script src="password-visibility.js?v=2"></script><script src="reset-password.js?v=2"></script></body></html>
